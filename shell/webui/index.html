<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>stem · WebUIShell</title>
<style>
  /* ============ OLED 友好主题：纯黑底 + 边框分层（无灰底卡片） + 双色语义 ============ */
  :root {
    --bg: #000000;            /* OLED 纯黑 */
    --surface: #060708;       /* 极深面板（≈黑，靠边框分层） */
    --border: #1c2026;        /* 主分层边框 */
    --border-strong: #2e3540; /* 焦点/强调边框 */
    --text: #eef1f3;
    --muted: #6b7480;
    --accent: #3df5c8;        /* 青绿 = 正常/运行/主操作 */
    --accent-dim: rgba(61, 245, 200, .16);
    --alert: #ff2ec8;         /* 品红 = 需介入（ask / interrupted / 危险操作） */
    --alert-dim: rgba(255, 46, 200, .16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; }
  ::selection { background: var(--accent-dim); }
  button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--border-strong); color: var(--accent); }
  button.alert:hover { color: var(--alert); border-color: var(--alert); }

  /* —— 左栏：agent 列表（边框分层，不用阴影卡片） —— */
  aside { width: 280px; min-width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  aside h1 { font-size: 14px; letter-spacing: .06em; padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  aside h1 small { color: var(--muted); font-weight: normal; }
  #agentList { flex: 1; overflow-y: auto; }
  .agent { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #0e1013; border-left: 2px solid transparent; }
  .agent:hover { background: #090b0d; }
  .agent.active { border-left-color: var(--accent); background: #090b0d; }
  .agent .name { font-weight: 600; font-size: 13px; }
  .agent .meta { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
  .agent .status { float: right; font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  /* 状态 = 字形 + 颜色 双重编码（黑白极端对比下不依赖颜色） */
  .agent .status.thinking, .agent .status.holding { color: var(--accent); }
  .agent .status.interrupted { color: var(--alert); }
  .agent .status.idle { color: var(--muted); }
  #createBox { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  #createBox h3 { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
  #createBox select, #createBox input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 13px; }
  #createBox select:focus, #createBox input:focus { outline: none; border-color: var(--accent); }
  #createBox button { border-color: var(--accent); color: var(--accent); }
  #createBox button:hover { background: var(--accent-dim); }

  /* —— 主区 —— */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); }
  #header .name { font-weight: 600; }
  #header .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  #header .actions { margin-left: auto; display: flex; gap: 8px; }
  #timeline { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }

  /* 消息 = 扁平左边框制，无圆角气泡堆叠 */
  .msg { max-width: 82%; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); }
  .msg.user { align-self: flex-end; border-left: none; border-right: 2px solid var(--border-strong); }
  .msg.assistant { align-self: flex-start; border-left: 2px solid var(--border-strong); }
  .msg.tool { align-self: stretch; font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); border-left: 2px solid #12151a; background: #040506; }
  .msg.system { align-self: stretch; text-align: center; color: var(--muted); font-size: 12px; background: none; border: none; }
  .msg.meta { align-self: stretch; text-align: center; font-size: 12px; color: var(--accent); background: none; border: none; border-top: 1px dashed #12332a; border-bottom: 1px dashed #12332a; border-radius: 0; padding: 4px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-family: ui-monospace, monospace; }
  .msg.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #composer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--surface); }
  #composer textarea { flex: 1; resize: none; height: 46px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-size: 14px; font-family: inherit; }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #composer button { border-color: var(--accent); color: var(--accent); padding: 4px 18px; font-size: 14px; }
  #composer button:hover { background: var(--accent-dim); }

  /* —— ask 弹窗 = 品红（需介入语义） —— */
  #permission { position: fixed; right: 20px; top: 20px; width: 340px; background: var(--surface); border: 1px solid var(--alert); border-radius: 6px; padding: 14px; display: none; z-index: 10; }
  #permission .title { font-weight: 600; margin-bottom: 6px; color: var(--alert); }
  #permission .body { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  #permission .row { display: flex; gap: 8px; }
  #permission .once { border-color: var(--accent); color: var(--accent); }
  #permission .reject { border-color: var(--alert); color: var(--alert); }

  /* 连接状态点（header 右端） */
  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  #conn.on { background: var(--accent); box-shadow: 0 0 6px var(--accent-dim); }
</style>
</head>
<body>
<aside>
  <h1>STEM <small>· WebUIShell</small></h1>
  <div id="agentList"></div>
  <div id="createBox">
    <h3>创建 AGENT（以 user0 身份）</h3>
    <select id="createClass"></select>
    <input id="createPrompt" placeholder="首条 user prompt…" />
    <button id="createBtn">+ 实例化</button>
  </div>
</aside>
<main>
  <div id="header">
    <span class="name" id="curName">-</span>
    <span class="meta" id="curMeta"></span>
    <span class="actions">
      <button id="compactBtn" title="执行 classic compact（手动压缩上下文）">⊂ compact</button>
      <button id="stopBtn" title="中断当前轮（可恢复）">⏸ 中断</button>
      <button id="killBtn" class="alert" title="销毁实例（级联子树）">✕ 销毁</button>
      <span id="conn" title="事件流连接"></span>
    </span>
  </div>
  <div id="timeline"></div>
  <div id="composer">
    <textarea id="input" placeholder="以 user0 身份向当前 agent 发消息（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="sendBtn">发送</button>
  </div>
</main>
<div id="permission">
  <div class="title">⚠ 工具访问确认</div>
  <div class="body" id="permBody"></div>
  <div class="row">
    <button class="once" id="permOnce">单次批准</button>
    <button class="always" id="permAlways">始终批准</button>
    <button class="reject" id="permReject">拒绝</button>
  </div>
</div>
<script>
'use strict'
const $ = (id) => document.getElementById(id)
const timeline = $('timeline')
let currentAgentId = ''
let liveBubble = null
let pendingAccess = null

// ---------- 渲染 ----------

/** 状态字形映射：色 + 字形 + 文字三重编码（OLED 黑白主题不依赖颜色传达状态）。 */
const STATUS_GLYPH = { idle: '○', thinking: '◐', holding: '◕', interrupted: '▲' }
const statusText = (s) => `${STATUS_GLYPH[s] ?? '·'} ${s}`
const statusClass = (s) => (s === 'thinking' || s === 'holding' ? ' thinking' : s === 'interrupted' ? ' interrupted' : ' idle')

async function loadAgents() {
  const agents = await fetch('/api/agents').then((r) => r.json())
  const list = $('agentList')
  list.innerHTML = ''
  for (const a of agents) {
    const el = document.createElement('div')
    el.className = 'agent' + (a.id === currentAgentId ? ' active' : '')
    el.innerHTML =
      `<div class="name">${esc(a.displayName)}<span class="status${statusClass(a.status)}">${esc(statusText(a.status))}</span></div>` +
      `<div class="meta">${esc(a.id)} · &lt;${esc(a.classRef)}&gt;${a.parentId ? '' : ' · 根'}</div>`
    el.onclick = () => selectAgent(a.id)
    list.appendChild(el)
  }
}

async function loadContext(id) {
  const data = await fetch('/api/agents/' + encodeURIComponent(id) + '/context').then((r) => r.json())
  renderTimeline(data.messages || [])
}

function renderTimeline(messages) {
  timeline.innerHTML = ''
  liveBubble = null
  for (const m of messages) {
    if (!m.valid) continue // markInvalid（compact 归档）消息不渲染——但保留在仓库（可审计）
    if (m.tag === 'summary') { timeline.appendChild(msgEl('meta', '— 上下文摘要（compact 归档，原文保留于仓库）—')); continue }
    if (m.role === 'system') continue // system 提示词不上时间线
    if (m.role === 'tool') { timeline.appendChild(msgEl('tool', '⚙ ' + m.content)); continue }
    const isUser = m.role === 'user'
    const el = msgEl(isUser ? 'user' : 'assistant', m.content, isUser ? '你' : (m.from ? '来自 ' + m.from : currentAgentId))
    timeline.appendChild(el)
  }
  timeline.scrollTop = timeline.scrollHeight
}

function msgEl(cls, text, who) {
  const el = document.createElement('div')
  el.className = 'msg ' + cls
  if (who) el.innerHTML = `<div class="who">${esc(who)}</div>`
  el.appendChild(document.createTextNode(text))
  return el
}

// ---------- 事件流 ----------

function openStream() {
  const es = new EventSource('/api/events')
  es.onopen = () => $('conn').classList.add('on')
  es.onmessage = (e) => handleEvent(JSON.parse(e.data))
  es.onerror = () => { $('conn').classList.remove('on'); es.close(); setTimeout(openStream, 2000) }
}

function handleEvent(ev) {
  if (ev.type === 'stream') {
    if (ev.agentId === currentAgentId && ev.event.type === 'text-delta') {
      if (!liveBubble) { liveBubble = msgEl('assistant streaming', '', currentAgentId); timeline.appendChild(liveBubble); }
      liveBubble.appendChild(document.createTextNode(ev.event.text))
      timeline.scrollTop = timeline.scrollHeight
    }
    return
  }
  if (ev.type === 'letter') {
    const content = (ev.letters && ev.letters[0] && typeof ev.letters[0].content === 'string') ? ev.letters[0].content : ''
    const sender = (content.match(/^<sender id="([^"]+)">/) || [])[1]
    if (content.startsWith('<access_request')) showPermission(content)
    else if (sender === currentAgentId) { liveBubble = null; loadContext(currentAgentId) }
    else if (ev.agentId === currentAgentId) { liveBubble = null; loadContext(currentAgentId) }
    return
  }
  if (ev.type === 'status') loadAgents()
}

// ---------- 访问确认（ask 消息化） ----------

function showPermission(content) {
  const m = content.match(/<access_request id="([^"]+)" accessKey="([^"]+)" agentId="([^"]+)">/)
  if (!m) return
  pendingAccess = { requestId: m[1], accessKey: m[2], agentId: m[3] }
  $('permBody').textContent = `agent ${m[3]} 申请使用工具「${m[2]}」（授权者：族谱根 user0 = 你）`
  $('permission').style.display = 'block'
}
async function replyAccess(reply) {
  if (!pendingAccess) return
  await fetch('/api/access', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestId: pendingAccess.requestId, reply }) })
  pendingAccess = null
  $('permission').style.display = 'none'
}
$('permOnce').onclick = () => replyAccess('once')
$('permAlways').onclick = () => replyAccess('always')
$('permReject').onclick = () => replyAccess('reject')

// ---------- 动作 ----------

async function selectAgent(id) {
  currentAgentId = id
  liveBubble = null
  const agents = await fetch('/api/agents').then((r) => r.json())
  const a = agents.find((x) => x.id === id)
  $('curName').textContent = a ? a.displayName : id
  $('curMeta').textContent = a ? `${a.id} · <${a.classRef}> · ${statusText(a.status)}` : ''
  await loadAgents()
  await loadContext(id)
}

async function send() {
  const text = $('input').value.trim()
  if (!text || !currentAgentId) return
  $('input').value = ''
  timeline.appendChild(msgEl('user', text, '你'))
  timeline.scrollTop = timeline.scrollHeight
  await fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: currentAgentId, text }) })
}

async function createAgent() {
  const className = $('createClass').value
  const userPrompt = $('createPrompt').value.trim() || '你好，请做一个简短的自我介绍。'
  const r = await fetch('/api/instantiate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ className, userPrompt }) })
  const data = await r.json()
  if (data.agentId) selectAgent(data.agentId)
}

async function loadTemplates() {
  const templates = await fetch('/api/templates').then((r) => r.json())
  const sel = $('createClass')
  sel.innerHTML = ''
  for (const t of templates) {
    if (t.panel) continue // 面板类（user/策略 role）不可实例化对话
    const opt = document.createElement('option')
    opt.value = t.name
    opt.textContent = t.name
    sel.appendChild(opt)
  }
}

$('sendBtn').onclick = send
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } })
$('createBtn').onclick = createAgent
$('stopBtn').onclick = async () => { if (currentAgentId) await fetch('/api/interrupt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: currentAgentId }) }) }
$('compactBtn').onclick = async () => {
  if (!currentAgentId) return
  const r = await fetch('/api/context_action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: currentAgentId, action: 'compact' }) })
  const d = await r.json()
  if (d.result) { await loadContext(currentAgentId) }
}
$('killBtn').onclick = async () => {
  if (!currentAgentId || currentAgentId === 'user0') return
  if (!confirm(`销毁 ${currentAgentId}？（级联销毁其子树；消息语料保留于仓库）`)) return
  await fetch('/api/terminate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: currentAgentId, recursive: true }) })
  currentAgentId = ''
  await loadAgents()
  const agents = await fetch('/api/agents').then((r) => r.json())
  const first = agents.find((a) => a.id !== 'user0')
  if (first) await selectAgent(first.id)
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

// ---------- 启动 ----------
(async () => {
  await loadTemplates()
  await loadAgents()
  const agents = await fetch('/api/agents').then((r) => r.json())
  const first = agents.find((a) => a.id !== 'user0') || agents[0]
  if (first) await selectAgent(first.id)
  openStream()
})()
</script>
</body>
</html>
