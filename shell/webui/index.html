<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>stem · WebUIShell</title>
<style>
  /* ============ OLED 主题：纯黑底 + 无边框文档流（opencode 风）+ 双色语义（R8） ============ */
  :root {
    --bg: #000000;            /* OLED 纯黑 */
    --surface: #060708;       /* 极深面板 */
    --border: #1c2026;        /* 主分层线（只用于分隔，不再做卡片描边） */
    --border-strong: #2e3540;
    --text: #eef1f3;
    --muted: #6b7480;
    --accent: #3df5c8;        /* 青绿 = 正常/运行/激活 */
    --accent-dim: rgba(61, 245, 200, .16);
    --alert: #ff2ec8;         /* 品红 = 需介入（ask / interrupted / 危险） */
    --alert-dim: rgba(255, 46, 200, .16);
    --warn: #e8c34a;
    --lane-w: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; overflow: hidden; }
  ::selection { background: var(--accent-dim); }
  button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--border-strong); color: var(--accent); }
  button[data-state="off"] { color: var(--muted); border-color: transparent; cursor: not-allowed; }
  button[data-state="off"]:hover { color: var(--muted); border-color: transparent; }

  /* 三态动作字（R8） */
  .ico { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
         border: 1px solid var(--border); border-radius: 4px; font-size: 12px; line-height: 1; cursor: pointer; }
  .ico[data-state="off"] { color: var(--muted); border-color: transparent; cursor: not-allowed;
         background: repeating-linear-gradient(45deg, transparent 0 3px, #0d1013 3px 4px); }
  .ico[data-state="ready"] { color: var(--text); border-color: var(--border-strong); }
  .ico[data-state="ready"]:hover { color: var(--accent); border-color: var(--accent); }
  .ico[data-state="active"] { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent-dim); }
  .ico.danger[data-state="ready"] { color: var(--muted); }
  .ico.danger[data-state="ready"]:hover { color: var(--alert); border-color: var(--alert); }

  /* —— 左栏：族谱树 / 实例化 / 当前 agent 信息+快捷控制 —— */
  aside { width: 320px; min-width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: width .15s; }
  aside h1 { font-size: 14px; letter-spacing: .06em; padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  aside h1 small { color: var(--muted); font-weight: normal; flex: 1; }
  #sideToggle { padding: 1px 8px; font-size: 11px; color: var(--muted); }
  #tree { flex: 1; overflow-y: auto; padding: 6px 0; }
  .tnode { position: relative; display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 4px; cursor: pointer; border-left: 2px solid transparent; }
  .tnode:hover { background: #090b0d; }
  .tnode.active { border-left-color: var(--accent); background: #090b0d; }
  .tnode .lanes { width: calc(var(--lane-w) * 5); flex: 0 0 auto; height: 24px; }
  .tnode .id { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tnode.active .id { color: var(--accent); }
  .tnode .lp { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tnode .st { font-size: 11px; font-family: ui-monospace, monospace; }
  .tnode .st.tone-active { color: var(--accent); }
  .tnode .st.tone-alert { color: var(--alert); }
  .tnode .st.tone-ready { color: var(--muted); }
  .tnode.rootnode .id { color: var(--muted); }
  .tnode.moren { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; padding: 3px 12px 3px 8px; }
  .tnode.moren .lanes { height: 18px; }
  .mbtn { visibility: hidden; flex: 0 0 auto; color: var(--muted); font-size: 11px; border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; cursor: pointer; }
  .tnode:hover .mbtn { visibility: visible; }
  .mbtn:hover { color: var(--accent); border-color: var(--accent); }

  /* 收起态：只留简化族谱（全名） */
  body.side-mini aside { width: 150px; min-width: 150px; }
  body.side-mini #createBox, body.side-mini #infoBox, body.side-mini .tnode .lanes,
  body.side-mini .tnode .lp, body.side-mini .tnode .st, body.side-mini .tnode .mbtn,
  body.side-mini aside h1 small { display: none; }

  #createBox { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  #createBox h3 { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
  #createBox select, #createBox input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 12px; }
  #createBox select:focus, #createBox input:focus { outline: none; border-color: var(--accent); }
  #createBox button { border-color: var(--accent); color: var(--accent); }
  #createBox button:hover { background: var(--accent-dim); }

  #infoBox { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; max-height: 46%; overflow-y: auto; }
  #infoBox[hidden] { display: none; }
  #infoHead { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; }
  #infoHead .sp { flex: 1; }
  #infoStatus { font-family: ui-monospace, monospace; font-size: 11px; font-weight: normal; }
  #infoRows { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 11px; }
  #infoRows .k { color: var(--muted); white-space: nowrap; }
  #infoRows .v { font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  #cfgTabs { display: flex; gap: 6px; }
  #cfgTabs button { padding: 1px 10px; font-size: 11px; color: var(--muted); border-color: transparent; }
  #cfgTabs button.on { color: var(--accent); border-color: var(--border); }
  .cfgPane { display: flex; flex-direction: column; gap: 6px; }
  .cfgPane[hidden] { display: none; }
  .cfgRow { display: flex; gap: 6px; align-items: center; }
  .cfgRow input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 12px; }
  #modelRow { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: ui-monospace, monospace; }
  #modelSel { background: var(--bg); color: var(--accent); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 12px; max-width: 200px; flex: 1; min-width: 0; }
  #modelOrigin { color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; font-size: 11px; }
  #classDef { max-height: 160px; overflow-y: auto; font-size: 11px; font-family: ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-word; background: #040506; border: 1px solid var(--border); border-radius: 4px; padding: 8px; }
  .hint { font-size: 11px; color: var(--muted); }

  /* —— 主区：无边框文档流 —— */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header { padding: 10px 22px 6px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #header .name { font-weight: 600; font-size: 15px; }
  #header .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  #header .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #timeline { flex: 1; overflow-y: auto; padding: 8px 22px 20px; display: flex; flex-direction: column; gap: 10px; }

  /* 消息 = 无边框文档流（opencode 风）：小标签 + 正文；me 右倾标签 */
  .msg { position: relative; max-width: 86%; word-break: break-word; }
  .msg.me { align-self: flex-end; }
  .msg.agent, .msg.them { align-self: flex-start; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; font-family: ui-monospace, monospace; }
  .msg.me .who { color: var(--accent); text-align: right; }
  .msg .md p { margin: 0 0 6px; } .msg .md > :last-child { margin-bottom: 0; }
  .msg .md h1, .msg .md h2, .msg .md h3, .msg .md h4, .msg .md h5, .msg .md h6 { margin: 6px 0 4px; font-size: 1.02em; color: var(--accent); }
  .msg .md pre { background: #0a0d10; border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; overflow-x: auto; font-size: 12px; margin: 4px 0; }
  .msg .md code { background: #0f1317; border-radius: 3px; padding: 0 4px; font-size: 12px; font-family: ui-monospace, monospace; }
  .msg .md pre code { background: none; border: none; padding: 0; }
  .msg .md ul, .msg .md ol { margin: 4px 0 6px 18px; } .msg .md li { margin: 1px 0; }
  .msg .md blockquote { border-left: 2px solid var(--muted); color: var(--muted); padding-left: 8px; margin: 4px 0; }
  .msg .md table { border-collapse: collapse; margin: 4px 0; font-size: 12px; }
  .msg .md th, .msg .md td { border: 1px solid var(--border); padding: 2px 8px; } .msg .md th { background: #0a0d10; }
  .msg .md a { color: var(--accent); } .msg .md hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
  .msg.tool { align-self: stretch; font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); white-space: pre-wrap; border-left: 2px solid #12151a; padding-left: 8px; }
  .msg.meta { align-self: stretch; text-align: center; font-size: 11px; color: var(--accent); white-space: pre-wrap; border-top: 1px dashed #12332a; border-bottom: 1px dashed #12332a; padding: 3px; }
  .copyBtn { position: absolute; top: 0; right: -26px; width: 22px; height: 18px; padding: 0; font-size: 10px; color: var(--muted); border-color: transparent; }
  .msg:hover .copyBtn { border-color: var(--border); }
  .copyBtn:hover { color: var(--accent); }
  .msg.streaming .md { display: inline; }
  .msg.streaming::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 1px; vertical-align: -2px;
         border-right: 2px solid var(--accent); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #turnStats { padding: 0 22px 4px; font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  #turnStats[hidden] { display: none; }

  #empty { align-self: center; margin: auto; text-align: center; color: var(--muted); font-size: 13px; max-width: 360px; line-height: 1.8; }
  #empty b { color: var(--accent); font-weight: 600; }

  /* composer = 无边框：顶部一条分隔，附件钮左、送钮右 */
  #composer { padding: 8px 22px 12px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
  #attachBtn { color: var(--muted); border-color: transparent; padding: 8px 10px; font-size: 13px; }
  #composer textarea { flex: 1; resize: none; height: 44px; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-size: 14px; font-family: inherit; }
  #composer textarea:focus { outline: none; border-color: var(--border-strong); }
  #composer textarea:disabled { color: var(--muted); cursor: not-allowed; }
  #sendBtn { border-color: var(--accent); color: var(--accent); padding: 8px 20px; font-size: 14px; border-radius: 6px; }
  #sendBtn:hover { background: var(--accent-dim); }
  #sendBtn:disabled { border-color: var(--border); color: var(--muted); cursor: not-allowed; background: none; }

  /* —— 流式 live 层 —— */
  #liveHost { display: flex; flex-direction: column; gap: 10px; }
  details.reason { align-self: flex-start; max-width: 86%; border: 1px dashed var(--border); border-radius: 4px; color: var(--muted); font-size: 12px; font-style: italic; padding: 4px 10px; }
  details.reason summary { cursor: pointer; outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 560px; }
  details.reason.running summary::after { content: " ▍"; animation: blink 1s step-end infinite; }
  details.reason .rbody { margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .chip { align-self: flex-start; font-size: 11px; font-family: ui-monospace, monospace; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 10px; }
  .chip.called { color: var(--accent); box-shadow: 0 0 6px var(--accent-dim); }
  .chip.success { color: var(--accent); }
  .chip.error { color: var(--alert); border-color: var(--alert); }

  /* —— 上下文占用进度条（铺底提示，三色带） —— */
  #ctxBar { height: 3px; background: #08090b; border-top: 1px solid var(--border); flex: 0 0 auto; }
  #ctxFill { height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
  #ctxFill.warn { background: var(--warn); } #ctxFill.danger { background: var(--alert); }

  /* —— 悬浮详情卡 / 二级操作菜单 / 监督抽屉 —— */
  #hoverCard { position: fixed; z-index: 12; width: 260px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px 10px; font-size: 11px; pointer-events: none; box-shadow: 0 4px 18px rgba(0,0,0,.65); }
  #hoverCard[hidden] { display: none; }
  #hoverCard .t { font-family: ui-monospace, monospace; font-weight: 600; margin-bottom: 4px; }
  #hoverCard .r { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; color: var(--muted); }
  #hoverCard .r b { color: var(--text); font-weight: normal; text-align: right; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #popover { position: fixed; z-index: 13; min-width: 132px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px; display: flex; flex-direction: column; box-shadow: 0 6px 20px rgba(0,0,0,.7); }
  #popover[hidden] { display: none; }
  #popover button { border: none; text-align: left; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
  #popover button:hover { background: #0d1115; }
  #popover button.danger:hover { color: var(--alert); background: var(--alert-dim); }
  #drawer { position: fixed; right: 16px; top: 56px; bottom: 16px; width: 380px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; display: flex; flex-direction: column; z-index: 9; padding: 10px 12px; gap: 8px; overflow: hidden; box-shadow: 0 0 24px rgba(0,0,0,.6); }
  #drawer[hidden] { display: none; }
  #drawerHead { display: flex; align-items: center; gap: 8px; font-size: 12px; font-family: ui-monospace, monospace; color: var(--accent); }
  #drawerHead .sp { flex: 1; }
  #drawerBody { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  #drawerBody .msg, #drawerBody details.reason { max-width: 100%; }

  /* —— 审 面板（ask 弹窗）—— */
  #permission { position: fixed; right: 20px; top: 20px; width: 340px; background: var(--surface); border: 1px solid var(--alert); border-radius: 6px; padding: 14px; display: none; z-index: 14; }
  #permission .title { font-weight: 600; margin-bottom: 6px; color: var(--alert); }
  #permission .body { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  #permission .row { display: flex; gap: 8px; }
  #permission .once { border-color: var(--accent); color: var(--accent); }
  #permission .reject { border-color: var(--alert); color: var(--alert); }

  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  #conn.on { background: var(--accent); box-shadow: 0 0 6px var(--accent-dim); }
</style>
</head>
<body>
<aside>
  <h1>STEM <small>· 族谱</small><span class="ico" id="sideToggle" data-state="ready" title="收起侧栏（再点展开）">隐</span></h1>
  <div id="tree"></div>
  <div id="createBox">
    <h3>实例化后代（user#0 = 根）</h3>
    <select id="createClass"></select>
    <select id="createModel" title="出生显式模型（模型三环·环一）；缺省 = 类基因>父继承>家学"></select>
    <input id="createPrompt" placeholder="首条 user prompt…" />
    <button id="createBtn">生 · 实例化</button>
  </div>
  <div id="infoBox" hidden>
    <div id="infoHead"><span id="infoName">—</span><span class="sp"></span><span id="infoStatus"></span></div>
    <div id="infoRows"></div>
    <div id="cfgTabs">
      <button data-tab="instance" class="on">实例配置</button>
      <button data-tab="class">类配置</button>
    </div>
    <div id="cfgInstance" class="cfgPane">
      <div id="modelRow"><span>模型</span><select id="modelSel" title="切换运行时模型（下一轮生效，不级联子女）"></select><span class="origin" id="modelOrigin"></span></div>
      <div class="cfgRow"><input id="renameInput" placeholder="新称呼（全局唯一）" /><button id="renameBtn">改名</button></div>
      <div class="cfgRow"><button data-state="off" title="工具收敛清单编辑（后续强化）">工 · 工具收敛（待强化）</button></div>
    </div>
    <div id="cfgClass" class="cfgPane" hidden>
      <pre id="classDef"></pre>
      <div class="hint">类定义编辑走模型侧进化面（agent_class_update，落盘 .stem/agent/，只影响后续实例）</div>
    </div>
  </div>
</aside>
<main>
  <div id="header">
    <span class="name" id="curName">族谱</span>
    <span class="meta" id="curMeta">—</span>
    <span class="actions"><span id="conn" title="事件流连接"></span></span>
  </div>
  <div id="timeline"></div>
  <div id="turnStats" hidden></div>
  <div id="composer">
    <button id="attachBtn" data-state="off" title="附件（即将上线）">附</button>
    <textarea id="input" placeholder="选择一位后代开始对话…" disabled></textarea>
    <button id="sendBtn" disabled>送</button>
  </div>
  <div id="ctxBar" title="上下文窗口占用"><div id="ctxFill"></div></div>
</main>
<div id="hoverCard" hidden></div>
<div id="popover" hidden></div>
<div id="drawer" hidden>
  <div id="drawerHead"><span id="drawerTitle">督</span><span class="sp"></span><span class="ico" id="drawerClose" title="关闭监督抽屉">閉</span></div>
  <div id="drawerBody"></div>
</div>
<div id="permission">
  <div class="title">审 · 工具访问确认</div>
  <div class="body" id="permBody"></div>
  <div class="row">
    <button class="once" id="permOnce">单次批准</button>
    <button class="always" id="permAlways">始终批准</button>
    <button class="reject" id="permReject">拒绝</button>
  </div>
</div>
<script type="module">
import { ACT_GLYPH, ROOT_ID, applyStreamEvent, clearBucket, computeTreeRows, contextRatio, createLiveBuckets, deriveActions, infoRows, mdToHtml, menuItems, ratioTone, reasoningView, relativeTime, routeLetters, statusGlyph, statusTone, truncate, turnStats } from '/view.js'

const $ = (id) => document.getElementById(id)
const timeline = $('timeline')
let currentAgentId = ''
let agentsCache = []
let templatesCache = []
let pendingAccess = null
// —— 流式 live 层状态（delta live-only：轮末 letter→loadContext 快照收口后清桶） ——
const liveBuckets = createLiveBuckets()
let watchAgentId = '' // 监督抽屉目标（'' = 关）
let liveHost = null
let ctxWindow = 128000
let paintQueued = false

// ---------- 族谱侧栏（SVG 泳道 + 悬浮详情 + 二级操作菜单） ----------

function lanesSvg(row) {
  const L = 14, half = 12
  const parts = []
  const color = row.type === 'node' ? (row.family === 0 ? 'var(--accent)' : row.family === 1 ? 'var(--muted)' : 'var(--border-strong)') : 'var(--border-strong)'
  for (const lane of row.passThrough ?? []) {
    parts.push(`<line x1="${(lane + 0.5) * L}" y1="0" x2="${(lane + 0.5) * L}" y2="24" stroke="${color}" stroke-width="1" opacity=".55"/>`)
  }
  if (row.type === 'node') {
    const cx = (row.lane + 0.5) * L
    if (row.join && row.parentLane !== null) {
      const px = (row.parentLane + 0.5) * L
      if (px === cx) parts.push(`<line x1="${px}" y1="0" x2="${cx}" y2="${half}" stroke="${color}" stroke-width="1"/>`)
      else parts.push(`<path d="M ${px} 0 L ${px} ${half} L ${cx} ${half}" fill="none" stroke="${color}" stroke-width="1"/>`)
    }
    parts.push(`<circle cx="${cx}" cy="${half}" r="3" fill="${row.isRoot ? 'none' : color}" stroke="${color}" stroke-width="1.5"/>`)
  } else {
    parts.push(`<text x="${(row.lane + 0.5) * L - 3}" y="15" fill="var(--muted)" font-size="11">└</text>`)
  }
  return `<svg class="lanes" viewBox="0 0 ${5 * L} 24" aria-hidden="true">${parts.join('')}</svg>`
}

async function loadAgents() {
  const agents = await fetch('/api/agents').then((r) => r.json())
  agentsCache = agents
  const tree = $('tree')
  tree.innerHTML = ''
  for (const row of computeTreeRows(agents)) {
    const el = document.createElement('div')
    if (row.type === 'more') {
      el.className = 'tnode moren'
      const label = row.kind === 'siblings' ? `… +${row.count} 兄弟（共 ${row.descendants} 实例）` : `… +${row.count} 后代（更深层折叠）`
      el.innerHTML = lanesSvg(row) + `<span>${label}</span>`
      tree.appendChild(el)
      continue
    }
    const a = row.row
    el.className = 'tnode' + (a.id === currentAgentId ? ' active' : '') + (row.isRoot ? ' rootnode' : '')
    const tone = statusTone(a.status)
    const glyph = row.isRoot ? ACT_GLYPH.me : statusGlyph(a.status)
    const lp = a.lastPrompt ? truncate(a.lastPrompt, 24) : `<${a.classRef ?? ''}>`
    el.innerHTML = lanesSvg(row) + `<span class="id">${esc(String(a.name ?? a.id))}</span><span class="lp">${esc(decodeEntities(lp))}</span><span class="st tone-${tone}">${glyph}</span>` +
      (row.isRoot ? '' : `<span class="mbtn" title="操作菜单">選</span>`)
    el.onclick = () => selectAgent(a.id)
    el.oncontextmenu = (e) => { e.preventDefault(); openMenu(a, e.clientX, e.clientY) }
    const mb = el.querySelector('.mbtn')
    if (mb !== null) mb.addEventListener('click', (e) => { e.stopPropagation(); const r = mb.getBoundingClientRect(); openMenu(a, r.left - 120, r.bottom + 2) })
    bindHover(el, a.id)
    tree.appendChild(el)
  }
  const cur = agents.find((x) => x.id === currentAgentId)
  renderInfoPanel(cur)
}

const decodeEntities = (s) => String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>')

// —— 悬浮详情卡（数据 = infoRows，与信息面板同源） ——
let hoverTimer = 0
let hideTimer = 0
function bindHover(el, id) {
  el.addEventListener('mouseenter', () => {
    clearTimeout(hideTimer)
    hoverTimer = setTimeout(() => {
      const a = agentsCache.find((x) => x.id === id)
      if (a === undefined) return
      const r = el.getBoundingClientRect()
      const card = $('hoverCard')
      card.innerHTML = `<div class="t">${esc(String(a.name ?? a.id))}#${esc(a.id)}</div><div class="r">` +
        infoRows(a).map((row) => `<span>${esc(row.k)}</span><b>${esc(row.v)}</b>`).join('') +
        `</div><div class="r" style="margin-top:3px"><span>最近对话</span><b>${esc(a.lastPrompt ? truncate(a.lastPrompt, 28) : '—')}</b></div>`
      card.hidden = false
      const w = 260
      card.style.left = Math.min(r.right + 6, innerWidth - w - 8) + 'px'
      card.style.top = Math.min(r.top, innerHeight - card.offsetHeight - 8) + 'px'
    }, 400)
  })
  el.addEventListener('mouseleave', () => {
    clearTimeout(hoverTimer)
    hideTimer = setTimeout(() => { $('hoverCard').hidden = true }, 150)
  })
  el.addEventListener('mousedown', () => clearTimeout(hoverTimer))
}

// —— 二级操作菜单（缩/停/毁/改名/配置全收进此单；树行右击或「選」钮） ——
function openMenu(agent, x, y) {
  const m = $('popover')
  m.innerHTML = ''
  for (const it of menuItems(agent)) {
    const b = document.createElement('button')
    b.textContent = it.label
    b.dataset.state = it.state
    if (it.danger === true) b.className = 'danger'
    if (it.state !== 'off') b.onclick = () => { closeMenu(); void runMenuAction(it.key, agent) }
    m.appendChild(b)
  }
  m.hidden = false
  m.style.left = Math.min(x, innerWidth - m.offsetWidth - 8) + 'px'
  m.style.top = Math.min(y, innerHeight - m.offsetHeight - 8) + 'px'
}
function closeMenu() { $('popover').hidden = true }
document.addEventListener('click', (e) => { const m = $('popover'); if (!m.hidden && !m.contains(e.target)) closeMenu() })

async function runMenuAction(key, agent) {
  switch (key) {
    case 'open': await selectAgent(agent.id); break
    case 'watch': (watchAgentId === agent.id ? closeDrawer : openDrawer)(agent.id); break
    case 'interrupt': await fetch('/api/interrupt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: agent.id }) }); break
    case 'compact':
      await fetch('/api/context_action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: agent.id, action: 'compact' }) })
      if (agent.id === currentAgentId) await loadContext(agent.id)
      break
    case 'rename': {
      const name = prompt(`为 ${agent.id} 取新称呼（全局唯一）：`, agent.name ?? '')
      if (name === null || name.trim() === '') break
      const r = await fetch('/api/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: agent.id, name: name.trim() }) }).then((x) => x.json())
      if (r.error !== undefined) alert(String(r.error))
      break
    }
    case 'instanceCfg': await selectAgent(agent.id); switchCfgTab('instance'); break
    case 'classCfg': await selectAgent(agent.id); switchCfgTab('class'); break
    case 'terminate': await terminateAgent(agent); break
  }
}

// ---------- 第一视角时间线（routeLetters 归位，user#0 非对话窗口） ----------

function renderTimeline(items) {
  timeline.innerHTML = ''
  liveHost = null // 历史整建：live 尾层随 next paint 重建
  for (const it of items) {
    if (it.kind === 'ask') continue // 来信 access_request → 「审」面板，不占正文流
    if (it.kind === 'meta') { timeline.appendChild(msgEl('meta', it.icon + '  ' + it.text)); continue }
    if (it.kind === 'tool') { timeline.appendChild(msgEl('tool', it.icon + '  ' + it.text)); continue }
    timeline.appendChild(msgEl(it.side, it.text, it.who))
  }
  if (items.length === 0) timeline.appendChild(emptyHint())
  timeline.scrollTop = timeline.scrollHeight
}

function emptyHint() {
  const el = document.createElement('div')
  el.id = 'empty'
  if (agentsCache.filter((a) => a.parentId !== null).length === 0) {
    el.innerHTML = '族谱仅根 <b>user#0</b>。<br/>于左下「<b>生</b>」实例化第一位后代，它将成为你的子节点、开启协作。'
  } else {
    el.innerHTML = '从左侧<b>族谱树</b>选择一位后代开始对话。'
  }
  return el
}

function msgEl(cls, text, who) {
  const el = document.createElement('div')
  el.className = 'msg ' + cls
  if (who) el.innerHTML = `<div class="who">${esc(who)}</div>`
  if (cls === 'tool' || cls === 'meta') {
    el.appendChild(document.createTextNode(text)) // 非 markdown 通道保原样
  } else {
    const d = document.createElement('div')
    d.className = 'md'
    d.innerHTML = mdToHtml(text)
    el.appendChild(d)
    const cp = document.createElement('button') // 项 7：消息复制
    cp.className = 'copyBtn'; cp.textContent = '複'; cp.title = '复制原文'
    cp.onclick = () => { void navigator.clipboard?.writeText(text); cp.textContent = '複' }
    el.appendChild(cp)
  }
  return el
}

async function loadContext(id) {
  const data = await fetch('/api/agents/' + encodeURIComponent(id) + '/context').then((r) => r.json())
  ctxWindow = Number(data.contextWindow) > 0 ? Number(data.contextWindow) : 128000
  renderTimeline(routeLetters(data.messages || [], id))
  paintCtxBar(contextRatio(data.messages, ctxWindow))
  const st = turnStats(data.messages)
  const ts = $('turnStats')
  ts.hidden = st.turns === 0
  ts.textContent = st.turns > 0
    ? `全 ${String(st.turns)} 轮 · ${st.tokens.toLocaleString()} tokens · 上下文 ${Math.round(contextRatio(data.messages, ctxWindow) * 100)}%${st.durationS > 0 ? ` · 最近一轮耗时 ${st.durationS.toFixed(1)}s` : ''}`
    : ''
  schedulePaint()
}

// ---------- 上下文占用进度条（铺底提示，三色带） ----------

function paintCtxBar(ratio) {
  const fill = $('ctxFill')
  fill.style.width = Math.round(ratio * 100) + '%'
  fill.className = ratioTone(ratio)
  $('ctxBar').title = `上下文占用 ${(ratio * 100).toFixed(1)}% / ${ctxWindow.toLocaleString()} tokens`
}

// ---------- 信息面板（左栏底：基础信息 + 实例/类配置二级页签） ----------

function renderInfoPanel(agent) {
  const box = $('infoBox')
  if (agent === undefined || agent === null) { box.hidden = true; return }
  box.hidden = false
  $('infoName').textContent = `${String(agent.name ?? agent.id)}#${agent.id}`
  const tone = statusTone(agent.status)
  const is = $('infoStatus')
  is.textContent = `${statusGlyph(agent.status)} ${String(agent.status ?? '')}`
  is.className = 'tone-' + tone
  $('infoRows').innerHTML = infoRows(agent).map((r) => `<span class="k">${esc(r.k)}</span><span class="v" title="${esc(r.v)}">${esc(r.v)}</span>`).join('')
  $('renameInput').placeholder = `当前「${String(agent.name ?? agent.id)}」→ 新称呼`
  renderModelRow(agent)
  renderClassDef(agent)
}

function renderClassDef(agent) {
  const t = templatesCache.find((x) => x.name === agent.classRef)
  const el = $('classDef')
  if (t === undefined) { el.textContent = `（类 ${String(agent.classRef ?? '—')} 定义不在本次装载清单）`; return }
  const tools = t.tools === undefined ? '（完整继承父档案）' : Object.entries(t.tools).map(([k, v]) => `${k}=${v}`).join(' ') || '（空表 = 本地封闭）'
  el.textContent =
`类 ${t.name}
描述：${t.description ?? '—'}
策略：${t.contextStrategy ?? '继承'}
工具：${tools}
提示词：${(t.systemPrompt ?? '—').slice(0, 240)}${(t.systemPrompt ?? '').length > 240 ? '…' : ''}`
}

function switchCfgTab(tab) {
  for (const b of $('cfgTabs').querySelectorAll('button')) b.classList.toggle('on', b.dataset.tab === tab)
  $('cfgInstance').hidden = tab !== 'instance'
  $('cfgClass').hidden = tab !== 'class'
}
for (const b of $('cfgTabs').querySelectorAll('button')) b.onclick = () => switchCfgTab(b.dataset.tab)

// ---------- 流式 live 层渲染（rAF 合帧节流；主列尾与抽屉共用 builder） ----------

function liveDom(bucket, id) {
  const frag = document.createDocumentFragment()
  const rv = reasoningView(bucket.reasoning, bucket.text === '') // 正文未起 = 还在想
  if (rv !== null) {
    const d = document.createElement('details')
    d.className = 'reason' + (rv.running ? ' running' : '')
    const s = document.createElement('summary')
    s.textContent = '思 · ' + rv.summary
    d.appendChild(s)
    const b = document.createElement('div')
    b.className = 'rbody'
    b.innerHTML = mdToHtml(rv.body)
    d.appendChild(b)
    frag.appendChild(d)
  }
  for (const t of bucket.tools) {
    const chip = document.createElement('div')
    const dur = t.doneAt > 0 && t.doneAt >= t.at ? ' · ' + ((t.doneAt - t.at) / 1000).toFixed(1) + 's' : ''
    chip.className = 'chip ' + t.phase
    chip.textContent = `${ACT_GLYPH.tool} ${t.name} ${t.phase === 'called' ? '执行' : t.phase === 'success' ? '完成' : '失败'}${dur}`
    frag.appendChild(chip)
  }
  if (bucket.text !== '') {
    const b = document.createElement('div')
    b.className = 'msg agent streaming'
    if (bucket.reasoning === '') { const who = document.createElement('div'); who.className = 'who'; who.textContent = bucketLabel(id); b.appendChild(who) }
    const d = document.createElement('div')
    d.className = 'md'
    d.innerHTML = mdToHtml(bucket.text)
    b.appendChild(d)
    frag.appendChild(b)
  }
  return frag
}

const bucketLabel = (id) => { const a = agentsCache.find((x) => x.id === id); return a && a.name ? a.name : id }

function nearBottom() { return timeline.scrollHeight - timeline.scrollTop - timeline.clientHeight < 160 }

function renderLive() {
  const b = currentAgentId !== '' ? liveBuckets[currentAgentId] : undefined
  if (b !== undefined) {
    if (liveHost === null || !liveHost.isConnected) {
      liveHost = document.createElement('div')
      liveHost.id = 'liveHost'
      timeline.appendChild(liveHost)
    }
    const stick = nearBottom()
    liveHost.replaceChildren(liveDom(b, currentAgentId))
    if (stick) timeline.scrollTop = timeline.scrollHeight
  } else if (liveHost !== null) {
    liveHost.remove()
    liveHost = null
  }
  if (watchAgentId !== '') {
    const wb = liveBuckets[watchAgentId]
    if (wb !== undefined) {
      const body = $('drawerBody')
      const stick = body.scrollHeight - body.scrollTop - body.clientHeight < 160
      body.replaceChildren(liveDom(wb, watchAgentId))
      if (stick) body.scrollTop = body.scrollHeight
    }
  }
}

function schedulePaint() {
  if (paintQueued) return
  paintQueued = true
  requestAnimationFrame(() => { paintQueued = false; renderLive() })
}

// ---------- 监督抽屉（订阅任意 agent live 流） ----------

function openDrawer(id) {
  watchAgentId = id
  $('drawer').hidden = false
  $('drawerTitle').textContent = '督 · ' + bucketLabel(id)
  schedulePaint()
}
function closeDrawer() {
  if (watchAgentId !== '') clearBucket(liveBuckets, watchAgentId)
  watchAgentId = ''
  $('drawer').hidden = true
  $('drawerBody').innerHTML = ''
}
$('drawerClose').onclick = closeDrawer

// ---------- 访问确认（ask 消息化 → 审面板） ----------

function showPermission(content) {
  const m = content.match(/<access_request id="([^"]+)" accessKey="([^"]+)" agentId="([^"]+)">/)
  if (m === null) return
  pendingAccess = { requestId: m[1], accessKey: m[2], agentId: m[3] }
  $('permBody').textContent = `agent ${m[3]} 申请使用工具「${m[2]}」（授权者：族谱根 user#0 = 你）`
  $('permission').style.display = 'block'
}
async function replyAccess(reply) {
  if (pendingAccess === null) return
  await fetch('/api/access', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestId: pendingAccess.requestId, reply }) })
  pendingAccess = null
  $('permission').style.display = 'none'
}
$('permOnce').onclick = () => replyAccess('once')
$('permAlways').onclick = () => replyAccess('always')
$('permReject').onclick = () => replyAccess('reject')

// ---------- 事件流 ----------

function openStream() {
  const es = new EventSource('/api/events')
  es.onopen = () => $('conn').classList.add('on')
  es.onmessage = (e) => handleEvent(JSON.parse(e.data))
  es.onerror = () => { $('conn').classList.remove('on'); es.close(); setTimeout(openStream, 2000) }
}

function handleEvent(ev) {
  applyStreamEvent(liveBuckets, ev) // delta 与 tool 相进桶；其余事件类型 reducer 无副作用穿越
  if (ev.type === 'stream' || ev.type === 'tool') {
    if (ev.agentId === currentAgentId || ev.agentId === watchAgentId) schedulePaint()
    return
  }
  if (ev.type === 'letter') {
    const content = (ev.letters && ev.letters[0] && typeof ev.letters[0].content === 'string') ? ev.letters[0].content : ''
    if (content.startsWith('<access_request')) { showPermission(content); return }
    if (ev.agentId === currentAgentId) {
      // 轮末快照收口：历史重建后清 live 桶（delta 不补间隙，快照自愈）。
      void loadContext(currentAgentId).then(() => clearBucket(liveBuckets, currentAgentId))
    }
    return
  }
  if (ev.type === 'status') {
    void loadAgents()
    if (ev.to === 'thinking') clearBucket(liveBuckets, ev.agentId) // 新轮开画布：上轮 live 残相清掉
    if ((ev.to === 'holding' || ev.to === 'idle') && (ev.agentId === currentAgentId || ev.agentId === watchAgentId)) schedulePaint()
  }
}

// ---------- 模型与动作 ----------

const ORIGIN_LABEL = { explicit: '显式', class: '类基因', inherited: '父继承', home: '家学' }
let modelRefs = []

async function loadModels() {
  const data = await fetch('/api/models').then((r) => r.json())
  modelRefs = data.refs ?? []
  const cm = $('createModel')
  cm.innerHTML = ''
  cm.add(new Option('模型：继承链（类基因>父继承>家学）', ''))
  for (const ref of modelRefs) cm.add(new Option('出生显式 · ' + ref, ref))
}

function renderModelRow(agent) {
  const sel = $('modelSel')
  sel.innerHTML = ''
  if (!agent || !agent.model) { $('modelRow').hidden = true; return }
  $('modelRow').hidden = false
  const cur = agent.model
  const refs = modelRefs.includes(cur) ? modelRefs : [cur, ...modelRefs]
  for (const ref of refs) sel.appendChild(new Option(ref, ref))
  sel.value = cur
  $('modelOrigin').textContent = ORIGIN_LABEL[agent.modelOrigin] ?? agent.modelOrigin ?? ''
}

$('modelSel').onchange = async () => {
  if (!currentAgentId) return
  const ref = $('modelSel').value
  await fetch('/api/set_model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: currentAgentId, model: ref }) })
  await loadAgents()
}

$('renameBtn').onclick = async () => {
  const name = $('renameInput').value.trim()
  if (name === '' || !currentAgentId) return
  const r = await fetch('/api/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: currentAgentId, name }) }).then((x) => x.json())
  if (r.error !== undefined) { alert(String(r.error)); return }
  $('renameInput').value = ''
}

function applyActions(agent) {
  const s = deriveActions(agent)
  const canSend = s.send !== 'off'
  $('sendBtn').disabled = !canSend
  $('input').disabled = !canSend
  $('input').placeholder = canSend ? `向 ${agent?.name ?? agent?.id ?? ''} 发消息（Enter 发送，Shift+Enter 换行）` : '选择一位后代开始对话…'
}

async function terminateAgent(agent) {
  const id = agent.id
  if (!confirm(`销毁 ${id}？（级联销毁其子树；消息语料保留于仓库）`)) return
  await fetch('/api/terminate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: id, recursive: true }) })
  if (id === currentAgentId) {
    currentAgentId = ''
    $('curName').textContent = '族谱'; $('curMeta').textContent = '—'; $('turnStats').hidden = true
    applyActions(null); renderInfoPanel(null)
    timeline.innerHTML = ''; timeline.appendChild(emptyHint())
  }
  if (id === watchAgentId) closeDrawer()
  await loadAgents()
}

// ---------- 侧栏收起 / 展开 ----------

$('sideToggle').onclick = () => {
  const mini = document.body.classList.toggle('side-mini')
  $('sideToggle').textContent = mini ? '展' : '隐'
  $('sideToggle').title = mini ? '展开侧栏' : '收起侧栏（简化族谱）'
}

// ---------- 会话动作 ----------

async function selectAgent(id) {
  currentAgentId = id
  const agents = await fetch('/api/agents').then((r) => r.json())
  agentsCache = agents
  const a = agents.find((x) => x.id === id)
  $('curName').textContent = a ? String(a.name ?? a.id) : id
  $('curMeta').textContent = a ? `${a.id} · <${a.classRef ?? ''}>${a.parentId ? ' · 父 ' + a.parentId : ' · 根'}` : '—'
  applyActions(a)
  renderInfoPanel(a)
  await loadAgents()
  if (a && a.parentId === null) {
    const data = await fetch('/api/agents/' + encodeURIComponent(id) + '/context').then((r) => r.json())
    renderTimeline(routeLetters(data.messages || [], id))
  } else {
    await loadContext(id)
  }
}

async function send() {
  const text = $('input').value.trim()
  if (text === '' || !currentAgentId) return
  $('input').value = ''
  await fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: currentAgentId, text }) })
}

async function createAgent() {
  const className = $('createClass').value
  const userPrompt = $('createPrompt').value.trim() || '你好，请做一个简短的自我介绍。'
  const body = { className, userPrompt }
  const model = $('createModel').value // 空 = 不显式（落类基因>父继承>家学链）
  if (model) body.model = model
  const r = await fetch('/api/instantiate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  const data = await r.json()
  if (data.agentId) { $('createPrompt').value = ''; void selectAgent(data.agentId) }
}

async function loadTemplates() {
  const templates = await fetch('/api/templates').then((r) => r.json())
  templatesCache = templates
  const sel = $('createClass')
  sel.innerHTML = ''
  for (const t of templates) {
    if (t.panel) continue // 面板类（user/策略 role）不可实例化对话
    sel.appendChild(new Option(t.name, t.name))
  }
}

$('sendBtn').onclick = send
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } })
$('createBtn').onclick = createAgent

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

// ---------- 启动（空桌引导：默认不选根，仅呈现族谱全景） ----------
;(async () => {
  await loadModels()
  await loadTemplates()
  await loadAgents()
  renderTimeline([])
  applyActions(null)
  openStream()
})()
</script>
</body>
