<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>stem · WebUIShell</title>
<style>
  /* ============ OLED 主题：纯黑底 + 边框分层 + 双色语义（R8 三态视觉） ============ */
  :root {
    --bg: #000000;            /* OLED 纯黑 */
    --surface: #060708;       /* 极深面板（≈黑，靠边框分层） */
    --border: #1c2026;        /* 主分层边框 */
    --border-strong: #2e3540; /* 焦点/强调边框 */
    --text: #eef1f3;
    --muted: #6b7480;
    --accent: #3df5c8;        /* 青绿 = 正常/运行/激活（荧光） */
    --accent-dim: rgba(61, 245, 200, .16);
    --alert: #ff2ec8;         /* 品红 = 需介入（ask / interrupted / 危险操作） */
    --alert-dim: rgba(255, 46, 200, .16);
    --lane-w: 14px;           /* 族谱泳道列宽 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; }
  ::selection { background: var(--accent-dim); }
  button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--border-strong); color: var(--accent); }

  /* 三态动作字（R8）：遮罩=不可用 / 白边框=可用 / 荧光=激活 */
  .ico { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
         border: 1px solid var(--border); border-radius: 4px; font-size: 12px; line-height: 1; cursor: pointer; }
  .ico[data-state="off"] { color: var(--muted); border-color: transparent; cursor: not-allowed;
         background: repeating-linear-gradient(45deg, transparent 0 3px, #0d1013 3px 4px); } /* 遮罩斜纹 */
  .ico[data-state="ready"] { color: var(--text); border-color: var(--border-strong); } /* 白边框 */
  .ico[data-state="ready"]:hover { color: var(--accent); border-color: var(--accent); }
  .ico[data-state="active"] { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent-dim); } /* 荧光 */
  .ico.danger[data-state="ready"] { color: var(--muted); }
  .ico.danger[data-state="ready"]:hover { color: var(--alert); border-color: var(--alert); }

  /* —— 左栏：族谱树侧栏 —— */
  aside { width: 300px; min-width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  aside h1 { font-size: 14px; letter-spacing: .06em; padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  aside h1 small { color: var(--muted); font-weight: normal; }
  #tree { flex: 1; overflow-y: auto; padding: 6px 0; }
  .tnode { position: relative; display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 8px; cursor: pointer; border-left: 2px solid transparent; }
  .tnode:hover { background: #090b0d; }
  .tnode.active { border-left-color: var(--accent); background: #090b0d; }
  .tnode .lanes { width: calc(var(--lane-w) * 5); flex: 0 0 auto; height: 24px; }
  .tnode .id { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; }
  .tnode .lp { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tnode .st { font-size: 11px; font-family: ui-monospace, monospace; }
  .tnode .st.tone-active { color: var(--accent); }
  .tnode .st.tone-alert { color: var(--alert); }
  .tnode .st.tone-ready { color: var(--muted); }
  .tnode.rootnode .id { color: var(--muted); }
  .tnode.moren { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; padding: 3px 12px 3px 8px; }
  .tnode.moren .lanes { height: 18px; }

  #createBox { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  #createBox h3 { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
  #createBox select, #createBox input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 13px; }
  #createBox select:focus, #createBox input:focus { outline: none; border-color: var(--accent); }
  #createBox button { border-color: var(--accent); color: var(--accent); }
  #createBox button:hover { background: var(--accent-dim); }

  /* —— 主区 —— */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--surface); flex-wrap: wrap; }
  #header .name { font-weight: 600; }
  #header .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  #modelRow { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: ui-monospace, monospace; }
  #modelRow .origin { color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; font-size: 11px; }
  #modelSel { background: var(--bg); color: var(--accent); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 12px; max-width: 220px; }
  #modelSel:focus { outline: none; border-color: var(--accent); }
  #header .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #timeline { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }

  /* 消息 = 扁平左边框制（第一视角：me 右 / agent·them 左） */
  .msg { max-width: 82%; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); }
  .msg.me { align-self: flex-end; border-left: none; border-right: 2px solid var(--border-strong); }
  .msg.agent { align-self: flex-start; border-left: 2px solid var(--border-strong); }
  .msg.them { align-self: flex-start; border-left: 2px solid var(--muted); }
  .msg.tool { align-self: stretch; font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); border-left: 2px solid #12151a; background: #040506; }
  .msg.meta { align-self: stretch; text-align: center; font-size: 12px; color: var(--accent); background: none; border: none; border-top: 1px dashed #12332a; border-bottom: 1px dashed #12332a; border-radius: 0; padding: 4px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-family: ui-monospace, monospace; }
  .msg.streaming { border-right-color: var(--accent); }
  .msg.streaming::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 1px; vertical-align: -2px;
         border-right: 2px solid var(--accent); animation: blink 1s step-end infinite; } /* 流式光标 = border-right */
  @keyframes blink { 50% { opacity: 0; } }

  #empty { align-self: center; margin: auto; text-align: center; color: var(--muted); font-size: 13px; max-width: 360px; line-height: 1.8; }
  #empty b { color: var(--accent); font-weight: 600; }

  #composer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--surface); }
  #composer textarea { flex: 1; resize: none; height: 46px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 12px; font-size: 14px; font-family: inherit; }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #composer textarea:disabled { color: var(--muted); cursor: not-allowed; }
  #sendBtn { border-color: var(--accent); color: var(--accent); padding: 4px 18px; font-size: 14px; }
  #sendBtn:hover { background: var(--accent-dim); }
  #sendBtn:disabled { border-color: var(--border); color: var(--muted); cursor: not-allowed; background: none; }

  /* —— ask 弹窗 =「审」面板（品红，需介入语义） —— */
  #permission { position: fixed; right: 20px; top: 20px; width: 340px; background: var(--surface); border: 1px solid var(--alert); border-radius: 6px; padding: 14px; display: none; z-index: 10; }
  #permission .title { font-weight: 600; margin-bottom: 6px; color: var(--alert); }
  #permission .body { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  #permission .row { display: flex; gap: 8px; }
  #permission .once { border-color: var(--accent); color: var(--accent); }
  #permission .reject { border-color: var(--alert); color: var(--alert); }

  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  #conn.on { background: var(--accent); box-shadow: 0 0 6px var(--accent-dim); }
</style>
</head>
<body>
<aside>
  <h1>STEM <small>· 族谱</small></h1>
  <div id="tree"></div>
  <div id="createBox">
    <h3>实例化后代（user0 = 根）</h3>
    <select id="createClass"></select>
    <select id="createModel" title="出生显式模型（模型三环·环一）；缺省 = 类基因>父继承>家学"></select>
    <input id="createPrompt" placeholder="首条 user prompt…" />
    <button id="createBtn">生 · 实例化</button>
  </div>
</aside>
<main>
  <div id="header">
    <span class="name" id="curName">族谱</span>
    <span class="meta" id="curMeta">—</span>
    <span id="modelRow" hidden>
      <select id="modelSel" title="切换运行时模型（下一轮生效，不级联子女）"></select>
      <span class="origin" id="modelOrigin"></span>
    </span>
    <span class="actions">
      <span class="ico" id="compactBtn" data-state="off" title="执行 classic compact（手动压缩上下文）">缩</span>
      <span class="ico" id="stopBtn" data-state="off" title="中断当前轮（可恢复）">停</span>
      <span class="ico danger" id="killBtn" data-state="off" title="销毁实例（级联子树）">毁</span>
      <span id="conn" title="事件流连接"></span>
    </span>
  </div>
  <div id="timeline"></div>
  <div id="composer">
    <textarea id="input" placeholder="选择一位后代开始对话…" disabled></textarea>
    <button id="sendBtn" disabled>送</button>
  </div>
</main>
<div id="permission">
  <div class="title">审 · 工具访问确认</div>
  <div class="body" id="permBody"></div>
  <div class="row">
    <button class="once" id="permOnce">单次批准</button>
    <button class="always" id="permAlways">始终批准</button>
    <button class="reject" id="permReject">拒绝</button>
  </div>
</div>
<script type="module">
import { ACT_GLYPH, ROOT_ID, computeTreeRows, deriveActions, routeLetters, statusGlyph, statusTone, truncate } from '/view.js'

const $ = (id) => document.getElementById(id)
const timeline = $('timeline')
let currentAgentId = ''
let agentsCache = []
let liveBubble = null
let pendingAccess = null

// ---------- SVG 泳道族谱（行 = id · 最近 user_prompt · 状态字） ----------

/** 单行泳道 SVG：背景竖线（passThrough 祖先泳道）+ 本行 join（父泳道 → 本泳道，圆点收尾）。 */
function lanesSvg(row) {
  const L = 14, half = 12
  const parts = []
  const color = row.type === 'node' ? (row.family === 0 ? 'var(--accent)' : row.family === 1 ? 'var(--muted)' : 'var(--border-strong)') : 'var(--border-strong)'
  for (const lane of row.passThrough ?? []) {
    parts.push(`<line x1="${(lane + 0.5) * L}" y1="0" x2="${(lane + 0.5) * L}" y2="24" stroke="${color}" stroke-width="1" opacity=".55"/>`)
  }
  if (row.type === 'node') {
    const cx = (row.lane + 0.5) * L
    if (row.join && row.parentLane !== null) {
      const px = (row.parentLane + 0.5) * L
      if (px === cx) parts.push(`<line x1="${px}" y1="0" x2="${cx}" y2="${half}" stroke="${color}" stroke-width="1"/>`)
      else parts.push(`<path d="M ${px} 0 L ${px} ${half} L ${cx} ${half}" fill="none" stroke="${color}" stroke-width="1"/>`)
    }
    parts.push(`<circle cx="${cx}" cy="${half}" r="3" fill="${row.isRoot ? 'none' : color}" stroke="${color}" stroke-width="1.5"/>`)
  } else {
    parts.push(`<text x="${(row.lane + 0.5) * L - 3}" y="15" fill="var(--muted)" font-size="11">└</text>`)
  }
  return `<svg class="lanes" viewBox="0 0 ${5 * L} 24" aria-hidden="true">${parts.join('')}</svg>`
}

async function loadAgents() {
  const agents = await fetch('/api/agents').then((r) => r.json())
  agentsCache = agents
  const tree = $('tree')
  tree.innerHTML = ''
  for (const row of computeTreeRows(agents)) {
    const el = document.createElement('div')
    if (row.type === 'more') {
      el.className = 'tnode moren'
      const label = row.kind === 'siblings' ? `… +${row.count} 兄弟（共 ${row.descendants} 实例）` : `… +${row.count} 后代（更深层折叠）`
      el.innerHTML = lanesSvg(row) + `<span>${label}</span>`
      tree.appendChild(el)
      continue
    }
    const a = row.row
    el.className = 'tnode' + (a.id === currentAgentId ? ' active' : '') + (row.isRoot ? ' rootnode' : '')
    const tone = statusTone(a.status)
    const glyph = row.isRoot ? ACT_GLYPH.me : statusGlyph(a.status)
    const label = row.isRoot ? `${a.id} · 根` : a.id
    const lp = a.lastPrompt ? truncate(a.lastPrompt, 30) : `&lt;${a.classRef ?? ''}&gt;`
    el.innerHTML = lanesSvg(row) + `<span class="id">${esc(label)}</span><span class="lp">${esc(decodeEntities(lp))}</span><span class="st tone-${tone}">${glyph}</span>`
    el.onclick = () => selectAgent(a.id)
    tree.appendChild(el)
  }
}

const decodeEntities = (s) => String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>')

// ---------- 第一视角时间线（routeLetters 归位，user0 非对话窗口） ----------

function renderTimeline(items) {
  timeline.innerHTML = ''
  liveBubble = null
  for (const it of items) {
    if (it.kind === 'ask') continue // 来信 access_request → 「审」面板，不占正文流
    if (it.kind === 'meta') { timeline.appendChild(msgEl('meta', it.icon + '  ' + it.text)); continue }
    if (it.kind === 'tool') { timeline.appendChild(msgEl('tool', it.icon + '  ' + it.text)); continue }
    timeline.appendChild(msgEl(it.side, it.text, it.who))
  }
  if (items.length === 0) timeline.appendChild(emptyHint())
  timeline.scrollTop = timeline.scrollHeight
}

function emptyHint() {
  const el = document.createElement('div')
  el.id = 'empty'
  if (agentsCache.filter((a) => a.parentId !== null).length === 0) {
    el.innerHTML = '族谱仅根 <b>user0</b>。<br/>于左下「<b>生</b>」实例化第一位后代，它将成为你的子节点、开启协作。'
  } else {
    el.innerHTML = '从左侧<b>族谱树</b>选择一位后代开始对话。'
  }
  return el
}

function msgEl(cls, text, who) {
  const el = document.createElement('div')
  el.className = 'msg ' + cls
  if (who) el.innerHTML = `<div class="who">${esc(who)}</div>`
  el.appendChild(document.createTextNode(text))
  return el
}

async function loadContext(id) {
  const data = await fetch('/api/agents/' + encodeURIComponent(id) + '/context').then((r) => r.json())
  renderTimeline(routeLetters(data.messages || [], id))
}

// ---------- 事件流 ----------

function openStream() {
  const es = new EventSource('/api/events')
  es.onopen = () => $('conn').classList.add('on')
  es.onmessage = (e) => handleEvent(JSON.parse(e.data))
  es.onerror = () => { $('conn').classList.remove('on'); es.close(); setTimeout(openStream, 2000) }
}

function handleEvent(ev) {
  if (ev.type === 'stream') {
    if (ev.agentId === currentAgentId && ev.event.type === 'text-delta') {
      if (!liveBubble) { liveBubble = msgEl('agent streaming', '', currentAgentId); timeline.appendChild(liveBubble) }
      liveBubble.appendChild(document.createTextNode(ev.event.text))
      timeline.scrollTop = timeline.scrollHeight
    }
    return
  }
  if (ev.type === 'letter') {
    const content = (ev.letters && ev.letters[0] && typeof ev.letters[0].content === 'string') ? ev.letters[0].content : ''
    if (content.startsWith('<access_request')) { showPermission(content); return }
    if (ev.agentId === currentAgentId) { liveBubble = null; loadContext(currentAgentId) }
    return
  }
  if (ev.type === 'status') loadAgents()
}

// ---------- 访问确认（ask 消息化 → 审面板） ----------

function showPermission(content) {
  const m = content.match(/<access_request id="([^"]+)" accessKey="([^"]+)" agentId="([^"]+)">/)
  if (!m) return
  pendingAccess = { requestId: m[1], accessKey: m[2], agentId: m[3] }
  $('permBody').textContent = `agent ${m[3]} 申请使用工具「${m[2]}」（授权者：族谱根 user0 = 你）`
  $('permission').style.display = 'block'
}
async function replyAccess(reply) {
  if (!pendingAccess) return
  await fetch('/api/access', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestId: pendingAccess.requestId, reply }) })
  pendingAccess = null
  $('permission').style.display = 'none'
}
$('permOnce').onclick = () => replyAccess('once')
$('permAlways').onclick = () => replyAccess('always')
$('permReject').onclick = () => replyAccess('reject')

// ---------- 头部（模型行 + origin 徽标 + 三态动作） ----------

const ORIGIN_LABEL = { explicit: '显式', class: '类基因', inherited: '父继承', home: '家学' }
let modelRefs = []

async function loadModels() {
  const data = await fetch('/api/models').then((r) => r.json())
  modelRefs = data.refs ?? []
  // 实例化面板的出生模型选择（环一入口）：候选 = 注册表白名单；空值 = 继承链
  const cm = $('createModel')
  if (cm) {
    cm.innerHTML = ''
    cm.add(new Option('模型：继承链（类基因>父继承>家学）', ''))
    for (const ref of modelRefs) cm.add(new Option('出生显式 · ' + ref, ref))
  }
}

function renderModelRow(agent) {
  const sel = $('modelSel')
  sel.innerHTML = ''
  if (!agent || !agent.model) { $('modelRow').hidden = true; return }
  $('modelRow').hidden = false
  const cur = agent.model
  const refs = modelRefs.includes(cur) ? modelRefs : [cur, ...modelRefs]
  for (const ref of refs) {
    const opt = document.createElement('option')
    opt.value = ref
    opt.textContent = ref
    sel.appendChild(opt)
  }
  sel.value = cur
  $('modelOrigin').textContent = ORIGIN_LABEL[agent.modelOrigin] ?? agent.modelOrigin ?? ''
}

$('modelSel').onchange = async () => {
  if (!currentAgentId) return
  const ref = $('modelSel').value
  const slash = ref.indexOf('/')
  if (slash <= 0) return
  await fetch('/api/set_model', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agentId: currentAgentId, model: ref }) })
  await loadAgents()
  const a = agentsCache.find((x) => x.id === currentAgentId)
  renderModelRow(a)
}

function applyActions(agent) {
  const s = deriveActions(agent)
  $('stopBtn').dataset.state = s.interrupt === 'off' ? 'off' : 'ready'
  $('compactBtn').dataset.state = s.compact === 'off' ? 'off' : 'ready'
  $('killBtn').dataset.state = s.terminate === 'off' ? 'off' : 'ready'
  const canSend = s.send !== 'off'
  $('sendBtn').disabled = !canSend
  $('input').disabled = !canSend
  $('input').placeholder = canSend ? `向 ${agent?.id ?? ''} 发消息（Enter 发送，Shift+Enter 换行）` : '选择一位后代开始对话…'
}

// ---------- 动作 ----------

async function selectAgent(id) {
  currentAgentId = id
  liveBubble = null
  const agents = await fetch('/api/agents').then((r) => r.json())
  agentsCache = agents
  const a = agents.find((x) => x.id === id)
  $('curName').textContent = a ? a.name : id
  $('curMeta').textContent = a ? `${a.id} · <${a.classRef}> · ${statusGlyph(a.status)} ${a.status}${a.parentId ? ' · 父 ' + a.parentId : ' · 根'}` : '—'
  renderModelRow(a)
  applyActions(a)
  await loadAgents()
  if (a && a.parentId === null) renderTimeline(routeLetters(await fetch('/api/agents/' + encodeURIComponent(id) + '/context').then((r) => r.json()).then((d) => d.messages || []), id))
  else await loadContext(id)
}

async function send() {
  const text = $('input').value.trim()
  if (!text || !currentAgentId) return
  $('input').value = ''
  await fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: currentAgentId, text }) })
}

async function createAgent() {
  const className = $('createClass').value
  const userPrompt = $('createPrompt').value.trim() || '你好，请做一个简短的自我介绍。'
  const body = { className, userPrompt }
  const model = $('createModel').value // 空 = 不显式（落类基因>父继承>家学链）
  if (model) body.model = model
  const r = await fetch('/api/instantiate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  const data = await r.json()
  if (data.agentId) { $('createPrompt').value = ''; selectAgent(data.agentId) }
}

async function loadTemplates() {
  const templates = await fetch('/api/templates').then((r) => r.json())
  const sel = $('createClass')
  sel.innerHTML = ''
  for (const t of templates) {
    if (t.panel) continue // 面板类（user/策略 role）不可实例化对话
    const opt = document.createElement('option')
    opt.value = t.name
    opt.textContent = t.name
    sel.appendChild(opt)
  }
}

$('sendBtn').onclick = send
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } })
$('createBtn').onclick = createAgent
$('stopBtn').onclick = async () => { if ($('stopBtn').dataset.state === 'off' || !currentAgentId) return; await fetch('/api/interrupt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: currentAgentId }) }) }
$('compactBtn').onclick = async () => {
  if ($('compactBtn').dataset.state === 'off' || !currentAgentId) return
  await fetch('/api/context_action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: currentAgentId, action: 'compact' }) })
  await loadContext(currentAgentId)
}
$('killBtn').onclick = async () => {
  if ($('killBtn').dataset.state === 'off' || !currentAgentId) return
  if (!confirm(`销毁 ${currentAgentId}？（级联销毁其子树；消息语料保留于仓库）`)) return
  await fetch('/api/terminate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: currentAgentId, recursive: true }) })
  currentAgentId = ''
  $('curName').textContent = '族谱'; $('curMeta').textContent = '—'; $('modelRow').hidden = true; applyActions(null)
  await loadAgents()
  timeline.innerHTML = ''; timeline.appendChild(emptyHint())
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

// ---------- 启动（空桌引导：默认不选根，仅呈现族谱全景） ----------
;(async () => {
  await loadModels()
  await loadTemplates()
  await loadAgents()
  renderTimeline([])
  applyActions(null)
  openStream()
})()
</script>
</body>
</html>
